name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  test:
    name: Run tests on test DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.TEST_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.TEST_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-


      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Run tests
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql://${{ secrets.TEST_POSTGRES_USER }}:${{ secrets.TEST_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.TEST_POSTGRES_DB }}

  docker-test:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..60}; do
            if pg_isready -h postgres -p 5432 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"; then
              echo "PostgreSQL is ready for Docker tests!"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/60)"
            sleep 1
          done
          echo "PostgreSQL failed to start for Docker tests"
          exit 1
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Build and run Docker containers
        run: |
          docker compose up --build -d
          
          echo "Waiting for application to start..."
          sleep 10
          
          for i in {1..15}; do
            if curl -f http://localhost:8080/health >/dev/null 2>&1; then
              echo "Application health check passed!"
              break
            fi
            echo "Health check failed, retrying... ($i/15)"
            sleep 2
          done
          
          if ! curl -f http://localhost:8080/health >/dev/null 2>&1; then
            echo "::error::Application health check failed after all retries"
            docker compose logs app
            exit 1
          fi
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker compose down -v
