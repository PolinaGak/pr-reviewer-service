name: CI

on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Create test user and database
        run: |
          PGPASSWORD=${{ secrets.TEST_POSTGRES_PASSWORD }} psql -h localhost -U ${{ secrets.TEST_POSTGRES_USER }} -c "\
            CREATE USER ${{ secrets.TEST_POSTGRES_USER }} WITH PASSWORD '${{ secrets.TEST_POSTGRES_PASSWORD }}'; \
            CREATE DATABASE ${{ secrets.TEST_POSTGRES_DB }} OWNER ${{ secrets.TEST_POSTGRES_USER }};"
        env:
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}

      - name: Run tests
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql://${{ secrets.TEST_POSTGRES_USER }}:${{ secrets.TEST_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.TEST_POSTGRES_DB }}

  docker-test:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - name: Build and run with docker-compose
        run: |
          docker compose up --build -d
          sleep 15
          curl -f http://localhost:8080/health || (echo "Health check failed" && docker compose logs && exit 1)
          docker compose down -v
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
